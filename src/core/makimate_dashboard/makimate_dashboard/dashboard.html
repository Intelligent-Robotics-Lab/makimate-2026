<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakiMate Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e2e8f0;font-family:'Courier New',monospace;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Header ── */
header{background:#1a1f2e;padding:10px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #2d3748;flex-shrink:0}
header h1{font-size:1.1em;color:#f56565;letter-spacing:1px}
#conn-status{font-size:.75em;padding:3px 10px;border-radius:10px;background:#2d3748;color:#a0aec0;transition:all .3s}
#conn-status.ok{background:#1a3a2a;color:#68d391}
#conn-status.err{background:#3a1a1a;color:#fc8181}
header .spacer{flex:1}
#log-count{font-size:.75em;color:#718096}

/* ── Layout ── */
main{display:flex;flex:1;overflow:hidden}

/* ── Log panel ── */
#log-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid #2d3748;min-width:0}
#log-toolbar{background:#1a1f2e;padding:7px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;border-bottom:1px solid #2d3748}
#log-toolbar input,#log-toolbar select{background:#0f1117;border:1px solid #2d3748;color:#e2e8f0;padding:4px 8px;border-radius:4px;font-family:inherit;font-size:.75em;outline:none}
#log-toolbar input:focus,#log-toolbar select:focus{border-color:#4a5568}
#log-toolbar button{background:#2d3748;border:none;color:#e2e8f0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.75em}
#log-toolbar button:hover{background:#4a5568}
.auto-lbl{font-size:.75em;color:#718096;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:#f56565;cursor:pointer}
#log-body{flex:1;overflow-y:auto;padding:6px 8px;font-size:.76em;line-height:1.55}
#log-body::-webkit-scrollbar{width:5px}
#log-body::-webkit-scrollbar-thumb{background:#2d3748;border-radius:3px}
.le{padding:2px 5px;border-radius:3px;margin-bottom:1px;white-space:pre-wrap;word-break:break-all}
.le.D{color:#4a5568}
.le.I{color:#cbd5e0}
.le.W{color:#f6e05e;background:#2d2400}
.le.E{color:#fc8181;background:#2d0000}
.le.F{color:#fff;background:#6b0000;font-weight:bold}
.nn{color:#63b3ed}

/* ── Right panel ── */
#right{width:360px;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
#right::-webkit-scrollbar{width:5px}
#right::-webkit-scrollbar-thumb{background:#2d3748;border-radius:3px}

/* ── Sections ── */
.sec{padding:12px 14px;border-bottom:1px solid #2d3748}
.sec h2{font-size:.72em;color:#63b3ed;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}

/* ── Param rows ── */
.ng{margin-bottom:8px}
.ng-label{font-size:.68em;color:#718096;margin-bottom:2px;padding-left:2px}
.ng-desc{font-size:.63em;color:#4a5568;margin-bottom:5px;padding-left:2px;font-style:italic}
.pr{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.pr label{font-size:.72em;color:#a0aec0;flex:1;min-width:0}
.pr input[type=range]{flex:1.5;accent-color:#f56565;min-width:0}
.pr input[type=number],.pr input[type=text]{width:68px;background:#0f1117;border:1px solid #2d3748;color:#e2e8f0;padding:3px 6px;border-radius:4px;font-family:inherit;font-size:.72em;outline:none}
.pr input[type=text].wide{width:130px}
.pr input:focus{border-color:#4a5568}
.pr .vd{width:46px;font-size:.72em;color:#f6ad55;text-align:right;flex-shrink:0}
.set-btn{background:#c53030;border:none;color:#fff;padding:3px 9px;border-radius:4px;cursor:pointer;font-size:.7em;flex-shrink:0}
.set-btn:hover{background:#e53e3e}
.set-btn.ok{background:#276749;animation:flash .4s}
.set-btn.fail{background:#742a2a;animation:flash .4s}
@keyframes flash{0%{opacity:.4}100%{opacity:1}}

/* ── Server config ── */
.cr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cr label{font-size:.72em;color:#a0aec0;min-width:110px;flex-shrink:0}
.cr input,.cr select{flex:1;background:#0f1117;border:1px solid #2d3748;color:#e2e8f0;padding:4px 8px;border-radius:4px;font-family:inherit;font-size:.72em;outline:none;min-width:0}
.cr input:focus,.cr select:focus{border-color:#4a5568}
.cr select option{background:#0f1117}
.apply-row{display:flex;gap:8px;margin-top:4px;margin-bottom:12px}
.btn{background:#2d3748;border:1px solid #4a5568;color:#e2e8f0;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:.72em}
.btn:hover{background:#4a5568}
.btn.pri{background:#c53030;border-color:#c53030}
.btn.pri:hover{background:#e53e3e}
.divider{height:1px;background:#2d3748;margin:10px 0}
</style>
</head>
<body>

<header>
  <h1>&#129302; MakiMate Dashboard</h1>
  <span id="conn-status" class="err">Disconnected</span>
  <span class="spacer"></span>
  <span id="pi-ip" style="font-size:.72em;color:#718096"></span>
  <span id="log-count">0 logs</span>
</header>

<main>
  <!-- ── Log panel ── -->
  <div id="log-panel">
    <div id="log-toolbar">
      <input id="f-node" type="text" placeholder="Filter node..." oninput="rerender()" style="width:130px">
      <select id="f-level" onchange="rerender()">
        <option value="0">All</option>
        <option value="10">DEBUG+</option>
        <option value="20" selected>INFO+</option>
        <option value="30">WARN+</option>
        <option value="40">ERROR+</option>
      </select>
      <button onclick="clearLogs()">Clear</button>
      <label class="auto-lbl"><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
    </div>
    <div id="log-body"></div>
  </div>

  <!-- ── Right panel ── -->
  <div id="right">

    <!-- Robot Control -->
    <div class="sec">
      <h2>&#9654; Robot Control</h2>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span id="robot-dot" style="width:9px;height:9px;border-radius:50%;background:#4a5568;flex-shrink:0;transition:background .3s"></span>
        <span id="robot-status-text" style="font-size:.72em;color:#718096">Unknown</span>
      </div>
      <div class="apply-row">
        <button class="btn pri" onclick="robotStart()">Start</button>
        <button class="btn" onclick="robotStop()">Stop</button>
      </div>
      <div class="apply-row">
        <button class="btn" onclick="doPull()">Pull</button>
        <button class="btn" onclick="doRebuild()">Rebuild</button>
        <button class="btn" onclick="doPullRebuild()">Pull &amp; Rebuild</button>
      </div>
      <div class="apply-row">
        <button class="btn" onclick="doRestartDashboard()" title="sudo systemctl restart makimate.service">Restart Dashboard</button>
      </div>
      <div id="build-out" style="display:none;background:#080a0e;border:1px solid #2d3748;border-radius:4px;padding:6px 8px;font-size:.65em;line-height:1.6;max-height:160px;overflow-y:auto;margin-top:4px;color:#a0aec0;white-space:pre-wrap;word-break:break-all"></div>
    </div>

    <!-- Volume -->
    <div class="sec">
      <h2>&#128266; Volume</h2>
      <div class="pr">
        <label>Speaker Output</label>
        <input type="range" id="vol-slider" min="0" max="100" step="1" value="80"
               oninput="onVolSlider(this.value)">
        <span class="vd" id="vol-display">80%</span>
      </div>
      <div id="vol-status" style="font-size:.68em;color:#718096;margin-top:2px;min-height:1.2em"></div>
      <div class="pr" style="margin-top:6px">
        <label>Mic Input Gain</label>
        <input type="range" id="mic-slider" min="0" max="100" step="1" value="80"
               oninput="onMicSlider(this.value)">
        <span class="vd" id="mic-display">80%</span>
      </div>
      <div id="mic-status" style="font-size:.68em;color:#718096;margin-top:2px;min-height:1.2em"></div>
    </div>

    <!-- Server config -->
    <div class="sec">
      <h2>&#127760; Server Config</h2>

      <div class="cr"><label>LLM URL</label>
        <input type="text" id="llm_server_url" placeholder="http://host:8000"></div>
      <div class="cr"><label>LLM Model</label>
        <input type="text" id="llm_model" placeholder="e.g. llama3.2:3b"></div>
      <div class="apply-row">
        <button class="btn pri" onclick="applyServer('llm')">Apply LLM</button>
      </div>

      <div class="divider"></div>

      <div class="cr"><label>Whisper URL</label>
        <input type="text" id="whisper_server_url" placeholder="http://host:8001 (blank=local)"></div>
      <div class="cr"><label>Whisper Model</label>
        <select id="whisper_model">
          <option value="tiny">tiny — fastest (Pi local)</option>
          <option value="base" selected>base — fast (Pi local)</option>
          <option value="small">small — balanced</option>
          <option value="medium">medium — good (GPU)</option>
          <option value="large-v3">large-v3 — best accuracy (GPU)</option>
          <option value="distil-large-v3">distil-large-v3 — fast + accurate (GPU)</option>
        </select>
      </div>
      <div class="apply-row">
        <button class="btn pri" onclick="applyServer('whisper')">Apply Whisper</button>
        <button class="btn" onclick="checkWhisperServer()">Check Server</button>
      </div>
      <div id="whisper-status" style="font-size:.68em;color:#718096;margin-top:-4px;min-height:1.2em"></div>

      <div class="divider"></div>

      <div class="cr"><label>Speaker Identity</label>
        <button id="identity-toggle" class="btn" onclick="toggleIdentity()">Enabled</button>
      </div>
      <div style="font-size:.68em;color:#718096;margin-top:-4px">
        When disabled, skips voice/face recognition wait and name injection — saves ~300ms per turn.
      </div>
    </div>

    <!-- Parameters -->
    <div class="sec">
      <h2>&#9881; Parameters</h2>
      <div id="param-ui"></div>
    </div>

  </div><!-- /right -->
</main>

<script>
// ───────────────────────────────────────────────────────────────────
// One-line descriptions shown under each node group header
// ───────────────────────────────────────────────────────────────────
const NODE_DESC = {
  maki_dxl_6:              "Servo smoothing — how fast motors physically move",
  maki_behavior:           "Head tracking speed and face-search timeout",
  speaker_recognition_node:"Voice identity matching sensitivity",
  face_tracker:            "Who Maki gazes at when multiple faces are visible",
  respeaker_dsp:           "Hardware mic filtering (noise, echo, AGC)",
  respeaker_whisper_asr:   "Speech recognition — what to listen to and what to reject",
  ai_command_router:       "Wake / sleep words and reply keyword filter",
  natural_tts:             "TTS streaming — how quickly buffered text is sent to Piper",
  face_to_maki:            "Camera mounting offset — trims systematic left/right or up/down bias",
};

// ───────────────────────────────────────────────────────────────────
// Parameter definitions — keep in sync with PARAM_REGISTRY in
// dashboard_node.py (only need to add here for UI; server reads all)
// h: tooltip shown on label hover
// ───────────────────────────────────────────────────────────────────
const PARAMS = {
  maki_dxl_6: [
    {n:"smoothing_alpha", l:"Smoothing Alpha",        t:"f", min:.05, max:.5,  step:.01,  h:"How gradually motors approach their target. Higher = more sluggish but smoother."},
    {n:"update_rate",     l:"Motor Update Rate (Hz)", t:"f", min:10,  max:50,  step:1,    h:"How often servo commands are sent. 20 Hz is safe at 57600 baud."},
  ],
  maki_behavior: [
    {n:"no_face_threshold", l:"No-Face Timeout (frames)", t:"i", min:10, max:300, step:5,   h:"Frames with no face before entering scan mode. ~15 frames/s, so 90 ≈ 6 s."},
    {n:"track_gain_yaw",    l:"Track Speed — Left/Right", t:"f", min:.05,max:1.5, step:.05, h:"How aggressively the neck yaws to centre the face. Too high = wobble."},
    {n:"track_gain_pitch",  l:"Track Speed — Up/Down",    t:"f", min:.05,max:1.5, step:.05, h:"Same as above for pitch. Usually set slightly lower than yaw."},
  ],
  speaker_recognition_node: [
    {n:"threshold", l:"Voice Match Threshold", t:"f", min:.1, max:.9, step:.05, h:"Cosine distance cutoff for speaker ID. Lower = stricter, fewer false matches."},
  ],
  face_tracker: [
    {n:"recognition_threshold", l:"Face ID Threshold",           t:"f", min:.3,  max:.8,  step:.05, h:"face_recognition distance cutoff. Lower = stricter (fewer false matches)."},
    {n:"recognition_interval",  l:"Face ID Check Interval (fr)", t:"i", min:1,   max:60,  step:1,   h:"Run face recognition every N frames to save CPU."},
    {n:"weight_centerness",     l:"Gaze: Centerness",            t:"f", min:0,   max:1.0, step:.05, h:"Boosts faces closer to the middle of the frame."},
    {n:"weight_size",           l:"Gaze: Face Size",             t:"f", min:0,   max:1.0, step:.05, h:"Boosts faces that are larger / closer to the camera."},
    {n:"weight_lifetime",       l:"Gaze: Track Loyalty",         t:"f", min:0,   max:1.0, step:.05, h:"Favours faces tracked longer — prevents jumping to new arrivals."},
    {n:"weight_lips",           l:"Gaze: Speaking Priority",     t:"f", min:0,   max:1.0, step:.05, h:"Boosts whoever is talking. Raise to always look at the active speaker."},
  ],
  respeaker_dsp: [
    {n:"vad_threshold", l:"VAD Threshold (dB)",  t:"f", min:0,  max:10, step:.5, h:"ReSpeaker hardware VAD level. Higher = less sensitive, ignores quieter sounds."},
    {n:"enable_agc",    l:"Auto Gain Control",    t:"b",                          h:"Automatically adjusts mic gain. Turn off for consistent expo levels."},
    {n:"enable_ns",     l:"Noise Suppression",    t:"b",                          h:"Hardware background noise reduction."},
    {n:"enable_echo",   l:"Echo Cancellation",    t:"b",                          h:"Removes Maki's own TTS voice from the mic input."},
  ],
  respeaker_whisper_asr: [
    {n:"vad_aggressiveness",  l:"VAD Aggressiveness (0–3)",       t:"i", min:0,   max:3,    step:1,    h:"webrtcvad filter. 3 = most aggressive, rejects quiet/background speech."},
    {n:"silence_ms",          l:"Silence Gap → End of Utterance", t:"i", min:200, max:1200, step:50,   h:"ms of silence that signals end of speech before sending to Whisper."},
    {n:"no_speech_threshold", l:"No-Speech Filter",               t:"f", min:.1,  max:.95,  step:.05,  h:"Whisper confidence threshold. Higher = more audio is rejected as non-speech."},
    {n:"rms_threshold",       l:"RMS Gate (0=off, ~0.02=nearby)", t:"f", min:0,   max:.1,   step:.005, h:"Rejects quiet audio before Whisper sees it. Useful at expo to block distant voices."},
  ],
  ai_command_router: [
    {n:"wake_phrase",   l:"Wake Phrase",                          t:"s", h:"Maki starts paying attention when it hears this word or phrase."},
    {n:"sleep_phrase",  l:"Sleep Phrase",                         t:"s", h:"Maki stops listening after hearing this."},
    {n:"reply_keyword", l:"Reply Keyword (blank = always reply)", t:"s", h:"If set, Maki only responds when this word appears in the utterance."},
  ],
  natural_tts: [
    {n:"idle_flush_seconds", l:"Idle Flush Delay (s)", t:"f", min:.05, max:.8, step:.05, h:"Seconds of LLM inactivity before flushing remaining buffer to Piper. Lower = faster response on short answers. 0.15 is safe for fast servers."},
  ],
  face_to_maki: [
    {n:"camera_offset_x", l:"Camera Offset — Left/Right", t:"f", min:-0.5, max:0.5, step:.01, h:"Shifts the tracking target horizontally. Positive = camera is to the right of nose, head turns left to compensate."},
    {n:"camera_offset_y", l:"Camera Offset — Up/Down",    t:"f", min:-0.5, max:0.5, step:.01, h:"Shifts the tracking target vertically. Positive = camera is above nose centre."},
  ],
};

// ───────────────────────────────────────────────────────────────────
// Build param UI
// ───────────────────────────────────────────────────────────────────
function buildParamUI() {
  const root = document.getElementById('param-ui');
  root.innerHTML = '';
  for (const [node, ps] of Object.entries(PARAMS)) {
    const g = document.createElement('div');
    g.className = 'ng';
    const desc = NODE_DESC[node] ? `<div class="ng-desc">${NODE_DESC[node]}</div>` : '';
    g.innerHTML = `<div class="ng-label">${node}</div>${desc}`;
    for (const p of ps) {
      const row = document.createElement('div');
      row.className = 'pr';
      const tooltip = p.h ? ` title="${p.h}"` : '';
      const mid = p.t === 'b'
        ? `<input type="checkbox" id="v_${node}_${p.n}" style="margin:0 6px">`
        : p.t === 's'
        ? `<input type="text" class="wide" id="v_${node}_${p.n}" value="">`
        : `<input type="range"  id="s_${node}_${p.n}"
              min="${p.min}" max="${p.max}" step="${p.step}"
              value="${((p.min+p.max)/2).toFixed(p.t==='f'?2:0)}"
              oninput="syncNum('${node}','${p.n}',this.value)">
           <input type="number" id="v_${node}_${p.n}"
              min="${p.min}" max="${p.max}" step="${p.step}"
              value="${((p.min+p.max)/2).toFixed(p.t==='f'?2:0)}"
              oninput="syncSlider('${node}','${p.n}',this.value)"
              style="width:64px">`;
      row.innerHTML = `<label${tooltip}>${p.l}</label>${mid}
        <button class="set-btn" id="b_${node}_${p.n}"
          onclick="setParam('${node}','${p.n}')">Set</button>`;
      g.appendChild(row);
    }
    root.appendChild(g);
  }
}

function syncNum(node, pn, v) {
  const el = document.getElementById(`v_${node}_${pn}`);
  if (el) el.value = parseFloat(v).toFixed(
    PARAMS[node].find(p=>p.n===pn)?.t==='f' ? 2 : 0
  );
}
function syncSlider(node, pn, v) {
  const el = document.getElementById(`s_${node}_${pn}`);
  if (el) el.value = v;
}

function setParamUI(node, pn, val) {
  const vEl = document.getElementById(`v_${node}_${pn}`);
  const sEl = document.getElementById(`s_${node}_${pn}`);
  if (vEl) {
    const p = PARAMS[node]?.find(x=>x.n===pn);
    if (p?.t === 'b') vEl.checked = (val === true || val === 'true');
    else vEl.value = (p?.t==='f') ? parseFloat(val).toFixed(2) : val;
  }
  if (sEl) sEl.value = val;
}

function setParam(node, pn) {
  const el = document.getElementById(`v_${node}_${pn}`);
  if (!el) return;
  const p = PARAMS[node]?.find(x => x.n === pn);
  // Float params: ensure decimal point so ROS2 doesn't reject as wrong type (e.g. "8" → "8.0")
  const val = (p?.t === 'b') ? String(el.checked)
            : (p?.t === 'f') ? (el.value.includes('.') ? el.value : el.value + '.0')
            : el.value;
  send({type:'param_set', node, param:pn, value:val});
  const btn = document.getElementById(`b_${node}_${pn}`);
  if (btn) { btn.textContent='...'; btn.disabled=true; }
}

function flashBtn(node, pn, ok) {
  const btn = document.getElementById(`b_${node}_${pn}`);
  if (!btn) return;
  btn.disabled = false;
  btn.textContent = ok ? '✓' : '✗';
  btn.className = 'set-btn ' + (ok ? 'ok' : 'fail');
  setTimeout(() => { btn.textContent='Set'; btn.className='set-btn'; }, 1200);
}

// ───────────────────────────────────────────────────────────────────
// Volume
// ───────────────────────────────────────────────────────────────────
let volTimer = null;
function onVolSlider(v) {
  document.getElementById('vol-display').textContent = v + '%';
  clearTimeout(volTimer);
  volTimer = setTimeout(() => {
    send({type: 'volume_set', value: parseInt(v)});
  }, 120);  // debounce: send 120ms after user stops dragging
}

function setVolStatus(ok, msg) {
  const el = document.getElementById('vol-status');
  el.textContent = msg;
  el.style.color = ok ? '#68d391' : '#fc8181';
}

let micTimer = null;
function onMicSlider(v) {
  document.getElementById('mic-display').textContent = v + '%';
  clearTimeout(micTimer);
  micTimer = setTimeout(() => {
    send({type: 'mic_gain_set', value: parseInt(v)});
  }, 120);
}
function setMicStatus(ok, msg) {
  const el = document.getElementById('mic-status');
  el.textContent = msg;
  el.style.color = ok ? '#68d391' : '#fc8181';
}

// ───────────────────────────────────────────────────────────────────
// Server config
// ───────────────────────────────────────────────────────────────────
function applyServer(which) {
  if (which === 'llm') {
    send({type:'server_config',
      llm_server_url: document.getElementById('llm_server_url').value,
      llm_model:      document.getElementById('llm_model').value,
    });
  } else {
    send({type:'server_config',
      whisper_server_url: document.getElementById('whisper_server_url').value,
      whisper_model:      document.getElementById('whisper_model').value,
    });
  }
}

async function checkWhisperServer() {
  const url = document.getElementById('whisper_server_url').value.trim();
  const el  = document.getElementById('whisper-status');
  if (!url) { el.textContent = 'No server URL set — using Pi local inference.'; el.style.color='#718096'; return; }
  el.textContent = 'Checking...'; el.style.color = '#718096';
  try {
    const r = await fetch(`${url}/health`, {signal: AbortSignal.timeout(4000)});
    const d = await r.json();
    el.textContent = `✓ Server online — active model: ${d.model}`;
    el.style.color = '#68d391';
  } catch(e) {
    el.textContent = `✗ Cannot reach server: ${e.message}`;
    el.style.color = '#fc8181';
  }
}

function toggleIdentity() {
  const btn = document.getElementById('identity-toggle');
  const enabled = btn.textContent.trim() === 'Enabled';
  const newVal = !enabled;
  btn.textContent = newVal ? 'Enabled' : 'Disabled';
  btn.style.background = newVal ? '' : '#e53e3e';
  send({type: 'server_config', identity_enabled: newVal});
}

function applyServerConfigUI(cfg) {
  if (cfg.llm_server_url  !== undefined) document.getElementById('llm_server_url').value  = cfg.llm_server_url;
  if (cfg.llm_model       !== undefined) document.getElementById('llm_model').value       = cfg.llm_model;
  if (cfg.whisper_server_url !== undefined) document.getElementById('whisper_server_url').value = cfg.whisper_server_url;
  if (cfg.whisper_model   !== undefined) document.getElementById('whisper_model').value   = cfg.whisper_model;
  if (cfg.identity_enabled !== undefined) {
    const btn = document.getElementById('identity-toggle');
    btn.textContent = cfg.identity_enabled ? 'Enabled' : 'Disabled';
    btn.style.background = cfg.identity_enabled ? '' : '#e53e3e';
  }
}

// ───────────────────────────────────────────────────────────────────
// Logs
// ───────────────────────────────────────────────────────────────────
const LMAP = {10:'D', 20:'I', 30:'W', 40:'E', 50:'F'};
const LNAME= {10:'DEBUG', 20:'INFO', 30:'WARN', 40:'ERROR', 50:'FATAL'};
let logs = [], total = 0;

function addLog(e) {
  logs.push(e);
  total++;
  document.getElementById('log-count').textContent = total + ' logs';
  const lvl  = parseInt(document.getElementById('f-level').value);
  const node = document.getElementById('f-node').value.toLowerCase();
  if (e.level < lvl) return;
  if (node && !e.name.toLowerCase().includes(node)) return;
  appendLogEntry(e);
}

function appendLogEntry(e) {
  const body = document.getElementById('log-body');
  const d = document.createElement('div');
  d.className = 'le ' + (LMAP[e.level]||'I');
  d.dataset.level = e.level;
  d.dataset.node  = e.name;
  d.innerHTML = `<span class="nn">[${esc(e.name)}]</span> ${esc(e.msg)}`;
  body.appendChild(d);
  if (document.getElementById('autoscroll').checked)
    body.scrollTop = body.scrollHeight;
}

function rerender() {
  const body = document.getElementById('log-body');
  body.innerHTML = '';
  const lvl  = parseInt(document.getElementById('f-level').value);
  const node = document.getElementById('f-node').value.toLowerCase();
  for (const e of logs) {
    if (e.level < lvl) continue;
    if (node && !e.name.toLowerCase().includes(node)) continue;
    appendLogEntry(e);
  }
  if (document.getElementById('autoscroll').checked)
    body.scrollTop = body.scrollHeight;
}

function clearLogs() {
  logs = []; total = 0;
  document.getElementById('log-body').innerHTML = '';
  document.getElementById('log-count').textContent = '0 logs';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ───────────────────────────────────────────────────────────────────
// WebSocket
// ───────────────────────────────────────────────────────────────────
let ws = null;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {
    const el = document.getElementById('conn-status');
    el.textContent = 'Connected';
    el.className = 'ok';
  };
  ws.onclose = () => {
    const el = document.getElementById('conn-status');
    el.textContent = 'Disconnected — retrying...';
    el.className = 'err';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = ({data}) => {
    const m = JSON.parse(data);
    if (m.type === 'log') {
      addLog(m);
    } else if (m.type === 'param_value') {
      setParamUI(m.node, m.param, m.value);
    } else if (m.type === 'param_all') {
      for (const [node, ps] of Object.entries(m.params))
        for (const [pn, v] of Object.entries(ps))
          setParamUI(node, pn, v);
    } else if (m.type === 'param_set_ok') {
      flashBtn(m.node, m.param, true);
    } else if (m.type === 'param_set_fail') {
      flashBtn(m.node, m.param, false);
      console.warn('param_set_fail:', m.detail);
    } else if (m.type === 'server_config') {
      applyServerConfigUI(m.config);
    } else if (m.type === 'volume_ok') {
      setVolStatus(true, `✓ Volume set to ${m.value}%`);
    } else if (m.type === 'volume_fail') {
      setVolStatus(false, `✗ ${m.detail}`);
    } else if (m.type === 'volume_current') {
      document.getElementById('vol-slider').value = m.value;
      document.getElementById('vol-display').textContent = m.value + '%';
    } else if (m.type === 'mic_gain_ok') {
      setMicStatus(true, `✓ Mic gain set to ${m.value}%`);
    } else if (m.type === 'mic_gain_fail') {
      setMicStatus(false, `✗ ${m.detail}`);
    } else if (m.type === 'mic_gain_current') {
      document.getElementById('mic-slider').value = m.value;
      document.getElementById('mic-display').textContent = m.value + '%';
    } else if (m.type === 'system_info') {
      const el = document.getElementById('pi-ip');
      el.textContent = `${m.hostname}  ${m.ip}`;
      el.title = `http://${m.ip}:8080`;
    } else if (m.type === 'video_frame') {
      onVideoFrame(m.data);
    } else if (m.type === 'face_tracks') {
      _faceTracks = m.faces;
      const n = m.faces.length;
      document.getElementById('cam-status').textContent =
        n === 0 ? '' : `${n} face${n>1?'s':''} detected`;
    } else if (m.type === 'robot_status') {
      setRobotStatus(m.running, m.detail);
    } else if (m.type === 'build_start') {
      appendBuildLine('$ ' + m.cmd, '#63b3ed');
    } else if (m.type === 'build_line') {
      appendBuildLine(m.text);
    } else if (m.type === 'build_done') {
      appendBuildLine(m.ok ? '✓ Done' : '✗ Failed', m.ok ? '#68d391' : '#fc8181');
    }
  };
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ───────────────────────────────────────────────────────────────────
// Camera + face overlay
// ───────────────────────────────────────────────────────────────────
let _faceTracks = [];

function onVideoFrame(b64) {
  const img = document.getElementById('video-feed');
  img.src = 'data:image/jpeg;base64,' + b64;
  img.style.display = 'block';
}

(function initFaceCanvas() {
  const img    = document.getElementById('video-feed');
  const canvas = document.getElementById('face-canvas');
  if (!img || !canvas) return;  // camera section disabled
  const ctx    = canvas.getContext('2d');

  const SRC_W = 640, SRC_H = 480;

  function draw() {
    canvas.width  = img.clientWidth;
    canvas.height = img.clientHeight;
    const sx = img.clientWidth  / SRC_W;
    const sy = img.clientHeight / SRC_H;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const f of _faceTracks) {
      const [x, y, w, h] = f.bbox;
      ctx.strokeStyle = f.speaking ? '#f6e05e' : '#63b3ed';
      ctx.lineWidth = 2;
      ctx.strokeRect(x*sx, y*sy, w*sx, h*sy);
      if (f.name && f.name !== 'Unknown') {
        const label = f.name + (f.speaking ? ' 🗣' : '');
        ctx.font = '11px Courier New';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(x*sx, y*sy - 16, tw + 6, 16);
        ctx.fillStyle = '#63b3ed';
        ctx.fillText(label, x*sx + 3, y*sy - 3);
      }
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// ───────────────────────────────────────────────────────────────────
// Robot control
// ───────────────────────────────────────────────────────────────────
function robotStart()         { send({type:'robot_start'}); }
function robotStop()          { send({type:'robot_stop'}); }
function doPull()             { openBuildOut(); send({type:'git_pull'}); }
function doRebuild()          { openBuildOut(); send({type:'rebuild'}); }
function doPullRebuild()      { openBuildOut(); send({type:'pull_rebuild'}); }
function doRestartDashboard() { openBuildOut(); send({type:'restart_dashboard'}); }

function openBuildOut() {
  const el = document.getElementById('build-out');
  el.style.display = 'block';
  el.textContent = '';
}
function appendBuildLine(text, color) {
  const el = document.getElementById('build-out');
  const d = document.createElement('div');
  if (color) d.style.color = color;
  d.textContent = text;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function setRobotStatus(running, detail) {
  document.getElementById('robot-dot').style.background = running ? '#68d391' : '#fc8181';
  const t = document.getElementById('robot-status-text');
  t.textContent = running ? 'Running' : 'Stopped';
  t.style.color = running ? '#68d391' : '#fc8181';
  if (detail) t.title = detail;
}

// ───────────────────────────────────────────────────────────────────
buildParamUI();
connect();
</script>
