# MakiMate per-robot motor configuration
# Confirmed by physical testing with dxl_nudge.py
#
# Motor IDs:
#   1 = neck_yaw    — works
#   2 = neck_pitch  — works
#   3 = broken      — do not command (eyelid/eyeball mechanical conflict)
#   4 = broken      — do not command (no visible movement)
#   5 = lid_left    — works
#   6 = lid_right   — works

robot_limits:
  1: {min: 1500, max: 3000}    # neck_yaw   — needs full range calibration
  2: {min: 1600, max: 2400}    # neck_pitch — needs full range calibration
  3: {min:  800, max: 2200}    # broken     — not commanded
  4: {min:  800, max: 2200}    # broken     — not commanded
  5: {min:  490, max:  972}    # lid_left   — confirmed: 490=closed, 972=open
  6: {min:  120, max:  629}    # lid_right  — confirmed: 120=open,   629=closed

robot_neutral_positions:
  1: 2077    # neck_yaw   — centered (confirmed by dxl_nudge.py)
  2: 2032    # neck_pitch — upright  (confirmed)
  3: 1500    # broken     — parked
  4: 1500    # broken     — parked
  5:  731    # lid_left   — half open (midpoint 490–972)
  6:  374    # lid_right  — half open (midpoint 120–629)
